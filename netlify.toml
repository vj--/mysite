[build]
publish = "public"
# $URL is the site's primary domain on Netlify, so absolute links follow
# whichever domain is set as primary (wildcard.icu now, vijayraj.com after).
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.80.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.80.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.80.0"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.80.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"



# Canonical domain is vijayraj.com. Every other hostname 301s to it.
# Requires vijayraj.com to be the PRIMARY domain of this Netlify site first,
# otherwise this loops with any old vijayraj.com -> wildcard.icu redirect.
[[redirects]]
from = "https://wildcard.icu/*"
to = "https://vijayraj.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.wildcard.icu/*"
to = "https://vijayraj.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.vijayraj.com/*"
to = "https://vijayraj.com/:splat"
status = 301
force = true
