# All projects are Renu Design products. Each renders as one card on the home
# page. `url` is the project's own site (optional); every card also links to
# renudesign.com. The name links to `url`, or to renudesign.com if there is none.
- name: Heapr
  summary: Home inventory app for iOS and Android. Catalog what you own and where it lives.
  url: https://heapr.app
- name: Tempo Metronome
  summary: A clean, no-nonsense metronome for iOS.
  url: https://github.com/vj--/tempo-metronome-support
- name: doit
  summary: Kanban board for your terminal. Tasks live in a markdown file in a git repo you control, not a database.
  url: https://github.com/vj--/doit
