{{ $renu := "https://renudesign.com/#products" }}
<div class="project">
  <h3 class="project__name"><a href="{{ .url | default $renu }}">{{ .name }}</a></h3>
  <p class="project__summary">{{ .summary | markdownify }}</p>
  <p class="project__links">
    {{ with .url }}<a href="{{ . }}">{{ replaceRE "^https?://(www\\.)?([^/]+).*$" "$2" . }} →</a>{{ end }}
    <a href="{{ $renu }}">renudesign.com →</a>
  </p>
</div>
