<div class="project">
  <h3 class="project__name">{{ .name }}{{ with .org }} <span class="project__org">· {{ . }}</span>{{ end }}</h3>
  <p class="project__summary">{{ .summary | markdownify }}</p>
  {{ with .links }}
  <p class="project__links">
    {{ range . }}<a href="{{ .url }}">{{ .label }} →</a>{{ end }}
  </p>
  {{ end }}
</div>
